name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # NOTE: the Compact compiler is NOT an npm package. It ships as a
      # standalone binary installed via the official installer script.
      # See: https://docs.midnight.network/getting-started/installation
      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Compact compiler
        run: compact --version

      - name: Compile contract
        run: compact compile contracts/counter.compact managed/counter

      - name: Run test suite
        run: npm test
